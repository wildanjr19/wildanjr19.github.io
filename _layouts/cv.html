<!doctype html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <meta content="#DDD6B9" name="theme-color"/>
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  <meta content="{{ page.description | default: site.description | escape }}" name="description"/>
  <link href="{{ '/assets/favicon.svg' | relative_url }}" rel="icon" type="image/svg+xml"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Manrope:wght@650;800&amp;display=swap" rel="stylesheet"/>
  <link href="{{ '/assets/style.css' | relative_url }}" rel="stylesheet"/>
  <link href="{{ '/assets/cv.css' | relative_url }}" rel="stylesheet"/>
 </head>
 <body class="cv-page">
  <a class="skip-link" href="#main" lang="id">Langsung ke konten</a>
  <header class="container cv-header">
   <a aria-label="wildan, beranda" class="wordmark" href="{{ '/' | relative_url }}" lang="id">
    wildan<span class="wordmark-dot">.</span>
   </a>
   <a class="text-link cv-back" href="{{ '/' | relative_url }}" lang="id">
    Kembali ke portofolio
   </a>
  </header>
  <main class="container cv" id="main" lang="en">
   <p class="eyebrow">CURRICULUM VITAE</p>
   <h1>{{ site.title | escape }}</h1>
   <p class="cv-role">{{ site.description | escape }}</p>
   {{ content }}
  </main>
  <footer class="container site-footer cv-footer">
   <p>{{ site.title | escape }}</p>
   <div class="footer-links">
    <a href="https://github.com/wildanjr19" rel="noopener noreferrer" target="_blank">
     GitHub
     <span aria-hidden="true">↗</span>
    </a>
    <a href="https://www.linkedin.com/in/wildanabidalhanif/" rel="noopener noreferrer" target="_blank">
     LinkedIn
     <span aria-hidden="true">↗</span>
    </a>
    <a href="https://www.kaggle.com/wildanabid19" rel="noopener noreferrer" target="_blank">
     Kaggle
     <span aria-hidden="true">↗</span>
    </a>
   </div>
  </footer>
 </body>
</html>
